# Every push to main: the whole test suite runs, then the .deb, the AppImage and the Flatpak are
# built and checked, and replace the files of the "latest" GitHub Release (the newest build of
# main, always at https://github.com/herculepirate/tagmender/releases/tag/latest).
# Versioned releases still come from tags (release.yml).
# Actions are pinned to a commit (the version in the comment); all run on Node.js 24.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deb-appimage:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAGMENDER_DISCOGS_PLUGIN: ${{ github.workspace }}/plugins/picard-discogs-enrichment
      TAGMENDER_COVERUP_DIR: ${{ github.workspace }}/plugins/picard-coverup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: herculepirate/picard-discogs-enrichment, path: plugins/picard-discogs-enrichment}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: herculepirate/picard-coverup, path: plugins/picard-coverup}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev file libdiscid0 libegl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3
      - name: Python packages
        run: pip install uv
      - name: Build the .deb and the AppImage
        run: |
          packaging/build_deb.sh --discogs "$TAGMENDER_DISCOGS_PLUGIN" --coverup "$TAGMENDER_COVERUP_DIR"
          packaging/build_appimage.sh --with-player --discogs "$TAGMENDER_DISCOGS_PLUGIN" --coverup "$TAGMENDER_COVERUP_DIR"
      - name: Check what was built
        run: |
          v=$(python3 -c "import version; print(version.VERSION)")
          cd dist
          sha256sum -c "tagmender_${v}_all.deb.sha256" "TagMender-${v}-x86_64.AppImage.sha256"
          dpkg-deb --info "tagmender_${v}_all.deb" | grep -q "Version: ${v}"
          chmod +x "TagMender-${v}-x86_64.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 "./TagMender-${v}-x86_64.AppImage" --version | grep -q "${v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-appimage
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256

  flatpak:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # Flathub's build image with flatpak-builder and the KDE 6.10 SDK tools (pinned by digest)
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10@sha256:62920cbbb53c4e047801562c0475d70393482de9698dfeac740aad99e6c674e6
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}          # (the manifest builds this checkout as a git source)
      - name: Build the Flatpak
        # flatpak-builder itself, not a wrapper action: those still run on Node.js 20
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout -B main            # (a branch, not a detached commit, for the manifest's git source)
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo=repo build-dir packaging/flatpak/io.github.herculepirate.TagMender.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo TagMender.flatpak io.github.herculepirate.TagMender
          sha256sum TagMender.flatpak > TagMender.flatpak.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          if-no-files-found: error
          path: |
            TagMender.flatpak
            TagMender.flatpak.sha256

  publish:
    needs: [deb-appimage, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write                 # (only this job writes: it replaces the "latest" release)
    concurrency:
      group: publish-latest           # one publish at a time, never cancelled half-way
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {path: dist, merge-multiple: true}
      - name: Every file matches its checksum
        run: cd dist && sha256sum -c *.sha256
      - name: Notes
        run: |
          v=$(python3 -c "import version; print(version.VERSION)")
          cat > notes.md <<TXT
          The newest build of \`main\` (version ${v}, commit ${GITHUB_SHA::7}), rebuilt on every push
          after the whole test suite passes.

          **Install** (Linux, x86_64):
          - **AppImage** (any distribution): download it, \`chmod +x\` it and run it. Nothing to install.
          - **.deb** (Debian 12+, Ubuntu 24.04+, Mint 22+): \`sudo apt install ./tagmender_${v}_all.deb\`
          - **Flatpak**: \`flatpak install --user TagMender.flatpak\` (the KDE runtime comes from
            Flathub), then \`flatpak run io.github.herculepirate.TagMender\`

          Check a download with \`sha256sum -c FILE.sha256\`. First time? Read
          [First run](https://github.com/herculepirate/tagmender/blob/main/docs/FIRST_RUN.md):
          preview first, try one folder, undo once.
          TXT
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest --target "$GITHUB_SHA" --title "TagMender: latest build of main" \
            --notes-file notes.md --latest dist/*
