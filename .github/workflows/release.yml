# Tag a version (git tag v0.3.0 && git push origin v0.3.0): the whole test suite runs, then the
# AppImage and the .deb are built, checked, and attached with their checksums to a GitHub
# Release for that tag. The tag must match version.py; the notes are that version's section of
# docs/RELEASE_NOTES.md ("## 0.3.0 ...").
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAGMENDER_DISCOGS_PLUGIN: ${{ github.workspace }}/plugins/picard-discogs-enrichment
      TAGMENDER_COVERUP_DIR: ${{ github.workspace }}/plugins/picard-coverup
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: herculepirate/picard-discogs-enrichment, path: plugins/picard-discogs-enrichment}
      - uses: actions/checkout@v4
        with: {repository: herculepirate/picard-coverup, path: plugins/picard-coverup}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: The tag is the version in version.py
        run: |
          v=$(python3 -c "import version; print(version.VERSION)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but version.py says $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 dpkg-dev file
      - name: Python packages
        run: pip install -r packaging/requirements-appimage.txt uv
      - name: Every test suite
        run: ./run_tests.sh
      - name: Build the .deb and the AppImage
        run: |
          packaging/build_deb.sh --discogs "$TAGMENDER_DISCOGS_PLUGIN" --coverup "$TAGMENDER_COVERUP_DIR"
          packaging/build_appimage.sh --discogs "$TAGMENDER_DISCOGS_PLUGIN" --coverup "$TAGMENDER_COVERUP_DIR"
      - name: Check what was built
        run: |
          cd dist
          sha256sum -c "tagmender_${VERSION}_all.deb.sha256" "TagMender-${VERSION}-x86_64.AppImage.sha256"
          dpkg-deb --info "tagmender_${VERSION}_all.deb" | grep -q "Version: ${VERSION}"
          chmod +x "TagMender-${VERSION}-x86_64.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 "./TagMender-${VERSION}-x86_64.AppImage" --version | grep -q "${VERSION}"
      - name: Release notes for this version
        run: |
          awk -v v="## ${VERSION}" 'index($0, v) == 1 {on=1; next} /^## / && on {exit} on' \
            docs/RELEASE_NOTES.md > notes.md
          test -s notes.md || echo "See docs/RELEASE_NOTES.md." > notes.md
          cat >> notes.md <<'TXT'

          **Install** (Linux, x86_64): download the AppImage, `chmod +x` it and run it (no installation),
          or on Debian/Ubuntu/Mint `sudo apt install ./tagmender_<version>_all.deb`. First time? Read
          [First run](https://github.com/herculepirate/tagmender/blob/main/docs/FIRST_RUN.md):
          preview first, try one folder, undo once.
          TXT
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "TagMender ${VERSION}" --notes-file notes.md \
            dist/tagmender_${VERSION}_all.deb dist/tagmender_${VERSION}_all.deb.sha256 \
            dist/TagMender-${VERSION}-x86_64.AppImage dist/TagMender-${VERSION}-x86_64.AppImage.sha256
