# Every push and pull request runs the whole test suite, so a change from any session or machine
# that breaks something is caught before it reaches the library. On main, build.yml runs it
# before building the packages.
name: tests
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    # (four parts side by side, each running its files four at a time; every part must pass)
    name: tests ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    # (the tests' own time is 20 minutes; the system packages below have their own limit, so a
    # slow package mirror can no longer use it up - 2026-11-18: two shards cancelled after
    # apt-get took 19-20 minutes, before a test ran)
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: packaging/requirements-appimage.txt}
      # (the system packages - ffmpeg pulls some 90 - are kept in a cache: installed from it with no
      # package mirror at all; a slow mirror failed or cancelled three runs on 2026-11-18)
      - id: debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: test-debs-noble-v1
          path: ~/debs
      - name: System packages
        timeout-minutes: 12
        run: |
          PKGS="ffmpeg libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3"
          if [ "${{ steps.debs.outputs.cache-hit }}" = "true" ] && ls ~/debs/*.deb >/dev/null 2>&1; then
            sudo dpkg -i ~/debs/*.deb >/dev/null && command -v ffmpeg && exit 0
            echo "installing from the cache failed; downloading"
          fi
          for i in 1 2 3; do
            timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
            timeout 420 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
              --no-install-recommends $PKGS && break
            echo "apt try $i failed; retrying"; sleep 10
            [ "$i" = 3 ] && exit 1
          done
          mkdir -p ~/debs && cp /var/cache/apt/archives/*.deb ~/debs/ 2>/dev/null || true
          command -v ffmpeg
      - name: Python packages
        run: pip install -r packaging/requirements-appimage.txt
      - name: Run every suite
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./run_tests.sh --shard ${{ matrix.shard }}/4 --jobs 4
