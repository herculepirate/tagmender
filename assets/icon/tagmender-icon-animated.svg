<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs><clipPath id="ios-mask"><rect width="1024" height="1024" rx="230" ry="230"></rect></clipPath></defs>
<g clip-path="url(#ios-mask)">
<svg viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="TagMender icon: green ripples spreading over red around a glass disc with a stacked T and M">
<style>
.e-r{transform-box:fill-box;transform-origin:center;animation:eRip 6s linear infinite;opacity:0}
.e-d2{animation-delay:-1.2s}.e-d3{animation-delay:-2.4s}.e-d4{animation-delay:-3.6s}.e-d5{animation-delay:-4.8s}
@keyframes eRip{0%{transform:scale(.35);opacity:0}12%{opacity:.6}100%{transform:scale(1.75);opacity:0}}
.e-spin{transform-box:view-box;transform-origin:512px 512px;animation:eSpin 18s linear infinite}
.e-spin2{transform-box:view-box;transform-origin:512px 512px;animation:eSpin 7s linear infinite}
@keyframes eSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){svg *{animation:none !important}}
</style>
<defs>
<radialGradient id="e-bg" cx="50%" cy="50%" r="72%">
<stop offset="0" stop-color="#30D158"></stop>
<stop offset=".4" stop-color="#30D158"></stop>
<stop offset=".54" stop-color="#FFD60A"></stop>
<stop offset=".7" stop-color="#FF9F0A"></stop>
<stop offset=".88" stop-color="#FF3B30"></stop>
<stop offset="1" stop-color="#B3121B"></stop>
</radialGradient>
<radialGradient id="e-disc" cx="50%" cy="38%" r="70%">
<stop offset="0" stop-color="#1D2836"></stop>
<stop offset="1" stop-color="#080C11"></stop>
</radialGradient>
<linearGradient id="e-ring" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FF3B30"></stop>
<stop offset=".5" stop-color="#FFD60A"></stop>
<stop offset="1" stop-color="#30D158"></stop>
</linearGradient>
<linearGradient id="e-gloss" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"></stop>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
</linearGradient>
<filter id="e-shadow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="30"></feGaussianBlur>
</filter>
<filter id="e-blur" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="50"></feGaussianBlur>
</filter>
<filter id="e-soft" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="10"></feGaussianBlur>
</filter>
</defs>
<rect width="1024" height="1024" fill="url(#e-bg)"></rect>
<g class="e-spin">
<g filter="url(#e-blur)" opacity=".35">
<ellipse cx="300" cy="260" rx="170" ry="80" fill="#FFFFFF"></ellipse>
<ellipse cx="760" cy="780" rx="190" ry="70" fill="#FFFFFF"></ellipse>
</g>
</g>
<g fill="none" stroke="#FFFFFF" stroke-width="9">
<circle class="e-r" cx="512" cy="512" r="300"></circle>
<circle class="e-r e-d2" cx="512" cy="512" r="300"></circle>
<circle class="e-r e-d3" cx="512" cy="512" r="300"></circle>
<circle class="e-r e-d4" cx="512" cy="512" r="300"></circle>
<circle class="e-r e-d5" cx="512" cy="512" r="300"></circle>
</g>
<circle cx="512" cy="540" r="228" fill="#000000" opacity=".55" filter="url(#e-shadow)"></circle>
<circle cx="512" cy="512" r="226" fill="url(#e-disc)"></circle>
<g class="e-spin2">
<circle cx="512" cy="512" r="202" fill="none" stroke="url(#e-ring)" stroke-width="7" stroke-linecap="round" stroke-dasharray="980 290"></circle>
</g>
<ellipse cx="512" cy="372" rx="150" ry="70" fill="url(#e-gloss)" opacity=".55"></ellipse>
<circle cx="512" cy="512" r="226" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="4"></circle>
<g transform="translate(512 516) scale(0.46) translate(-512 -515)">
<g transform="translate(0 16)" fill="#000000" opacity=".4" filter="url(#e-soft)">
<path d="M332 250H692V330H552V500H472V330H332Z"></path>
<path d="M332 780V540H412L512 658L612 540H692V780H612V666L536 756H488L412 666V780Z"></path>
</g>
<g fill="#FFFFFF">
<path d="M332 250H692V330H552V500H472V330H332Z"></path>
<path d="M332 780V540H412L512 658L612 540H692V780H612V666L536 756H488L412 666V780Z"></path>
</g>
</g>
</svg>
</g>
</svg>
