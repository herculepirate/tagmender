<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="TagMender">
<!-- TagMender "Ripple" icon, dark appearance: the same ripple as a glow on near-black. -->
<defs>
<radialGradient id="tmd-bg" cx="50%" cy="50%" r="72%">
<stop offset="0" stop-color="#0E141B"/>
<stop offset="1" stop-color="#030406"/>
</radialGradient>
<radialGradient id="tmd-glow" cx="50%" cy="50%" r="60%">
<stop offset="0" stop-color="#30D158" stop-opacity=".55"/>
<stop offset=".45" stop-color="#30D158" stop-opacity=".4"/>
<stop offset=".62" stop-color="#FFD60A" stop-opacity=".22"/>
<stop offset=".8" stop-color="#FF9F0A" stop-opacity=".12"/>
<stop offset="1" stop-color="#FF3B30" stop-opacity=".06"/>
</radialGradient>
<radialGradient id="tmd-wave" gradientUnits="userSpaceOnUse" cx="512" cy="512" r="512">
<stop offset="0" stop-color="#32D74B"/>
<stop offset=".58" stop-color="#32D74B"/>
<stop offset=".72" stop-color="#FFD60A"/>
<stop offset=".88" stop-color="#FF9F0A"/>
<stop offset="1" stop-color="#FF453A"/>
</radialGradient>
<radialGradient id="tmd-disc" cx="50%" cy="38%" r="70%">
<stop offset="0" stop-color="#1A2430"/>
<stop offset="1" stop-color="#05080C"/>
</radialGradient>
<linearGradient id="tmd-ring" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FF453A"/>
<stop offset=".5" stop-color="#FFD60A"/>
<stop offset="1" stop-color="#32D74B"/>
</linearGradient>
<linearGradient id="tmd-gloss" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<filter id="tmd-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#tmd-bg)"/>
<rect width="1024" height="1024" fill="url(#tmd-glow)"/>
<g fill="none" stroke="url(#tmd-wave)">
<circle cx="512" cy="512" r="280" stroke-width="8.4" stroke-opacity=".75"/>
<circle cx="512" cy="512" r="364" stroke-width="10.9" stroke-opacity=".5"/>
<circle cx="512" cy="512" r="448" stroke-width="13.4" stroke-opacity=".28"/>
</g>
<circle cx="512" cy="512" r="226" fill="url(#tmd-disc)"/>
<circle cx="512" cy="512" r="202" transform="rotate(129 512 512)" fill="none" stroke="url(#tmd-ring)" stroke-width="7" stroke-linecap="round" stroke-dasharray="980 290"/>
<ellipse cx="512" cy="372" rx="150" ry="70" fill="url(#tmd-gloss)" opacity=".55"/>
<circle cx="512" cy="512" r="226" fill="none" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="4"/>
<g transform="translate(512 516) scale(0.46) translate(-512 -515)">
<g transform="translate(0 16)" fill="#000000" opacity=".5" filter="url(#tmd-soft)">
<path d="M332 250H692V330H552V500H472V330H332Z"/>
<path d="M332 780V540H412L512 658L612 540H692V780H612V666L536 756H488L412 666V780Z"/>
</g>
<g fill="#FFFFFF">
<path d="M332 250H692V330H552V500H472V330H332Z"/>
<path d="M332 780V540H412L512 658L612 540H692V780H612V666L536 756H488L412 666V780Z"/>
</g>
</g>
</svg>
