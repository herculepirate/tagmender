<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="TagMender">
<!-- TagMender "Ripple" icon, static master. Full-bleed square: iOS/macOS apply their own corner mask. -->
<defs>
<radialGradient id="tm-bg" cx="50%" cy="50%" r="72%">
<stop offset="0" stop-color="#30D158"/>
<stop offset=".4" stop-color="#30D158"/>
<stop offset=".54" stop-color="#FFD60A"/>
<stop offset=".7" stop-color="#FF9F0A"/>
<stop offset=".88" stop-color="#FF3B30"/>
<stop offset="1" stop-color="#B3121B"/>
</radialGradient>
<radialGradient id="tm-disc" cx="50%" cy="38%" r="70%">
<stop offset="0" stop-color="#1D2836"/>
<stop offset="1" stop-color="#080C11"/>
</radialGradient>
<linearGradient id="tm-ring" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FF3B30"/>
<stop offset=".5" stop-color="#FFD60A"/>
<stop offset="1" stop-color="#30D158"/>
</linearGradient>
<linearGradient id="tm-gloss" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<filter id="tm-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
<radialGradient id="tm-glint">
<stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
<stop offset=".45" stop-color="#FFFFFF" stop-opacity=".5"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>
<filter id="tm-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
<linearGradient id="tm-tfill" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="760">
<stop offset="0" stop-color="#FF3B30"/>
<stop offset=".25" stop-color="#FF9F0A"/>
<stop offset=".5" stop-color="#FFD60A"/>
<stop offset="1" stop-color="#30D158"/>
</linearGradient>
<linearGradient id="tm-mfill" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="760">
<stop offset="0" stop-color="#30D158"/>
<stop offset=".5" stop-color="#FFD60A"/>
<stop offset=".75" stop-color="#FF9F0A"/>
<stop offset="1" stop-color="#FF3B30"/>
</linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#tm-bg)"/>
<g transform="rotate(50 512 512)" opacity=".35">
<ellipse cx="300" cy="260" rx="290" ry="200" fill="url(#tm-glint)"/>
<ellipse cx="760" cy="780" rx="310" ry="190" fill="url(#tm-glint)"/>
</g>
<g fill="none" stroke="#FFFFFF">
<circle cx="512" cy="512" r="280" stroke-width="8.4" stroke-opacity=".4"/>
<circle cx="512" cy="512" r="364" stroke-width="10.9" stroke-opacity=".26"/>
<circle cx="512" cy="512" r="448" stroke-width="13.4" stroke-opacity=".13"/>
</g>
<circle cx="512" cy="540" r="228" fill="#000000" opacity=".55" filter="url(#tm-shadow)"/>
<circle cx="512" cy="512" r="226" fill="url(#tm-disc)"/>
<circle cx="512" cy="512" r="202" transform="rotate(129 512 512)" fill="none" stroke="url(#tm-ring)" stroke-width="7" stroke-linecap="round" stroke-dasharray="980 290"/>
<ellipse cx="512" cy="372" rx="150" ry="70" fill="url(#tm-gloss)" opacity=".55"/>
<circle cx="512" cy="512" r="226" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="4"/>
<!-- monogram: T laid over M, flush edges, stem centred; T red to green, M green to red -->
<g transform="translate(512 516) scale(0.57) translate(-512 -560)">
<g transform="translate(0 18)" fill="#000000" opacity=".45" filter="url(#tm-soft)">
<path d="M260 760V360H384L512 600L640 360H764V760H648V579L562 740H462L376 579V760Z"/>
<path d="M260 360H764V476H570V760H454V476H260Z"/>
</g>
<path d="M260 760V360H384L512 600L640 360H764V760H648V579L562 740H462L376 579V760Z" fill="url(#tm-mfill)"/>
<path d="M260 360H764V476H570V760H454V476H260Z" fill="none" stroke="#111924" stroke-width="40" stroke-linejoin="miter"/>
<path d="M260 360H764V476H570V760H454V476H260Z" fill="url(#tm-tfill)"/>
</g>
</svg>
