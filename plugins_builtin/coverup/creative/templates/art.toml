# CoverUp style template. Edit freely or copy to make your own (any *.toml in this folder).
title = "Art (painterly / abstract)"
# {album}, {artist}, {year}, {genre}, {era} are filled in automatically
prompt = "Album cover artwork for \"{album}\" by {artist}: an expressive abstract painting, bold brush strokes, rich texture, gallery quality. {genre} {era} No text, no letters, no logos."
negative = "text, letters, words, typography, watermark, logo, signature, frame, border, low quality, blurry"
procedural = "brush"   # style used when no AI backend is used: gradient, nebula, rings, grid, minimal, bauhaus, halftone, waves, brush
palette = ['#1d3557', '#e63946', '#f1faee', '#a8dadc']
overlay_logo = true
overlay_title = true
