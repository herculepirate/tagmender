# CoverUp style template. Edit freely or copy to make your own (any *.toml in this folder).
title = "Geometric / Bauhaus"
# {album}, {artist}, {year}, {genre}, {era} are filled in automatically
prompt = "Album cover artwork for \"{album}\" by {artist}: a Bauhaus-inspired geometric composition, circles, triangles and bars, primary colours. {genre} {era} No text, no letters, no logos."
negative = "text, letters, words, typography, watermark, logo, signature, frame, border, low quality, blurry"
procedural = "bauhaus"   # style used when no AI backend is used: gradient, nebula, rings, grid, minimal, bauhaus, halftone, waves, brush
palette = ['#f2e8cf', '#d62828', '#003049', '#fcbf49']
overlay_logo = true
overlay_title = true
