# CoverUp style template. Edit freely or copy to make your own (any *.toml in this folder).
title = "Minimal typographic"
# {album}, {artist}, {year}, {genre}, {era} are filled in automatically
prompt = "Album cover artwork for \"{album}\" by {artist}: a minimalist composition, large flat colour fields, lots of negative space. {genre} {era} No text, no letters, no logos."
negative = "text, letters, words, typography, watermark, logo, signature, frame, border, low quality, blurry"
procedural = "minimal"   # style used when no AI backend is used: gradient, nebula, rings, grid, minimal, bauhaus, halftone, waves, brush
palette = ['#f4f1de', '#e07a5f', '#3d405b', '#81b29a']
overlay_logo = true
overlay_title = true
