# CoverUp style template. Edit freely or copy to make your own (any *.toml in this folder).
title = "Nature"
# {album}, {artist}, {year}, {genre}, {era} are filled in automatically
prompt = "Album cover artwork for \"{album}\" by {artist}: a serene natural landscape, mountains, forest and mist at golden hour, fine-art photography. {genre} {era} No text, no letters, no logos."
negative = "text, letters, words, typography, watermark, logo, signature, frame, border, low quality, blurry"
procedural = "waves"   # style used when no AI backend is used: gradient, nebula, rings, grid, minimal, bauhaus, halftone, waves, brush
palette = ['#2d6a4f', '#95d5b2', '#d8f3dc', '#e9c46a']
overlay_logo = true
overlay_title = true
