# CoverUp style template. Edit freely or copy to make your own (any *.toml in this folder).
title = "Vintage / Vinyl-era"
# {album}, {artist}, {year}, {genre}, {era} are filled in automatically
prompt = "Album cover artwork for \"{album}\" by {artist}: a vintage record sleeve illustration, worn paper texture, muted retro colours. {genre} {era} No text, no letters, no logos."
negative = "text, letters, words, typography, watermark, logo, signature, frame, border, low quality, blurry"
procedural = "rings"   # style used when no AI backend is used: gradient, nebula, rings, grid, minimal, bauhaus, halftone, waves, brush
palette = ['#f2cc8f', '#e07a5f', '#3d405b', '#f4f1de']
overlay_logo = true
overlay_title = true
